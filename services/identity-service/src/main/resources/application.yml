spring:
  application:
    name: identity-service
  datasource:
    url: ${IDENTITY_DATABASE_URL:jdbc:postgresql://localhost:5436/identity}
    username: ${IDENTITY_DATABASE_USERNAME:identity}
    password: ${IDENTITY_DATABASE_PASSWORD:identity_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/ltft}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/realms/ltft/protocol/openid-connect/certs}

server:
  port: ${IDENTITY_SERVICE_PORT:8084}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

ltft:
  identity:
    keycloak:
      base-url: ${KEYCLOAK_BASE_URL:http://localhost:8180}
      realm: ${KEYCLOAK_REALM:ltft}
      client-id: ${KEYCLOAK_JML_CLIENT_ID:ltft-jml-service}
      client-secret: ${KEYCLOAK_JML_CLIENT_SECRET:local-jml-secret-change-me}
