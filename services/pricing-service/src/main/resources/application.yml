spring:
  application:
    name: pricing-service
  datasource:
    url: ${PRICING_DATABASE_URL:jdbc:postgresql://localhost:5438/pricing}
    username: ${PRICING_DATABASE_USERNAME:pricing}
    password: ${PRICING_DATABASE_PASSWORD:pricing_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/ltft}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/realms/ltft/protocol/openid-connect/certs}

server:
  port: ${PRICING_SERVICE_PORT:8086}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

ltft:
  security:
    identity:
      base-url: ${IDENTITY_SERVICE_URL:http://localhost:8084}
