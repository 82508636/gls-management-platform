spring:
  application:
    name: customer-service
  datasource:
    url: ${CUSTOMER_DATABASE_URL:jdbc:postgresql://localhost:5434/customer}
    username: ${CUSTOMER_DATABASE_USERNAME:customer}
    password: ${CUSTOMER_DATABASE_PASSWORD:customer_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/ltft}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/realms/ltft/protocol/openid-connect/certs}

server:
  port: ${CUSTOMER_SERVICE_PORT:8082}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

ltft:
  security:
    identity:
      base-url: ${IDENTITY_SERVICE_URL:http://localhost:8084}
  integrations:
    vies:
      base-url: ${VIES_BASE_URL:https://ec.europa.eu/taxation_customs/vies/rest-api}
      connect-timeout: ${VIES_CONNECT_TIMEOUT:3s}
      read-timeout: ${VIES_READ_TIMEOUT:5s}
      max-concurrent-requests: ${VIES_MAX_CONCURRENT_REQUESTS:4}
      max-attempts: ${VIES_MAX_ATTEMPTS:3}
      retry-delay: ${VIES_RETRY_DELAY:250ms}
